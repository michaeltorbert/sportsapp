name: Tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
env:
  # Runner apt setup only. Playwright's --with-deps runs apt-get update and install; on hosted runners
  # many package downloads stalled on the Azure HTTP mirror before coming quickly from the canonical
  # HTTPS archive, and several jobs timed out before any test ran. Drop only the exact Azure Ubuntu
  # archive URI from active (uncommented) apt lines. Signing, suites, components, security and other
  # repositories stay unchanged. With no Azure entry the step changes nothing and the install itself
  # shows whether apt works; rerunning it is a no-op.
  PREFER_CANONICAL_UBUNTU_ARCHIVE: |
    set -euo pipefail
    . /etc/os-release
    if [ "${ID:-}" != ubuntu ]; then echo "::error::Expected an Ubuntu runner, found ${ID:-unknown}"; exit 1; fi
    azure='http://azure\.archive\.ubuntu\.com/ubuntu/?'
    canonical_re='https://archive\.ubuntu\.com/ubuntu/?'
    canonical='https://archive.ubuntu.com/ubuntu/'
    end='([[:space:]]|$)'
    list=/etc/apt/apt-mirrors.txt
    files=()
    for f in "$list" /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do [ -f "$f" ] && files+=("$f"); done
    # True when a file names the Azure archive outside a comment (no "#" before the URI on its line).
    names_azure() { grep -qE "^([^#]*[[:space:]])?${azure}${end}" "$1"; }
    changed=0
    for f in "${files[@]}"; do
      names_azure "$f" || continue
      if [ "$f" = "$list" ]; then
        # Mirror list read by "mirror+file:" sources: one URI per line, tried in order.
        if grep -qE "^${canonical_re}${end}" "$f"; then sudo sed -i -E "\#^${azure}${end}#d" "$f"
        else sudo sed -i -E "s#^${azure}${end}#${canonical}\1#" "$f"; fi
      else
        # deb822 .sources or one-line .list, skipping comments. A URIs line that already names the
        # canonical archive just drops the Azure entry; otherwise the Azure URI is replaced in place.
        sudo sed -i -E -e '/^[[:space:]]*#/b' -e "\#${canonical_re}# s#[[:space:]]+${azure}${end}#\1#g" -e "s#(^|[[:space:]])${azure}${end}#\1${canonical}\2#g" "$f"
      fi
      changed=1
    done
    if [ "$changed" -eq 0 ]; then echo "::notice::No active apt source names the Azure Ubuntu archive; apt configuration left unchanged"; exit 0; fi
    for f in "${files[@]}"; do
      if names_azure "$f"; then echo "::error::The Azure Ubuntu archive is still configured in $f"; exit 1; fi
    done
    grep -HsE 'archive\.ubuntu\.com|security\.ubuntu\.com|mirror\+file' "${files[@]}" || true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: .wrangler/logs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check TypeScript and configured Worker types
        run: npm run typecheck
      - name: Record source commit
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .release-evidence
          npm test 2>&1 | tee .release-evidence/tests.log
      - name: Validate production deployment package
        run: |
          npm run test:runtime
          npm run deploy:check
          npm run deploy:alerts -- --dry-run
      - name: Validate preview deployment package
        env:
          CLOUDFLARE_ENV: preview
        run: |
          npm run build
          npm run test:runtime
          npm run deploy:check
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tests-${{ github.sha }}
          path: |
            .release-evidence/tests.log
            .wrangler/logs/
          include-hidden-files: true
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-mobile
            engine: chromium
            shardIndex: 1
            shardTotal: 1
          - project: webkit-mobile
            engine: webkit
            shardIndex: 1
            shardTotal: 4
          - project: webkit-mobile
            engine: webkit
            shardIndex: 2
            shardTotal: 4
          - project: webkit-mobile
            engine: webkit
            shardIndex: 3
            shardTotal: 4
          - project: webkit-mobile
            engine: webkit
            shardIndex: 4
            shardTotal: 4
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: .wrangler/logs
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BROWSER_TEST_SHARD: ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record source commit
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build exact browser-test source
        run: npm run build
      - name: Prefer the canonical Ubuntu archive for browser dependencies
        run: bash -c "$PREFER_CANONICAL_UBUNTU_ARCHIVE"
      - name: Install ${{ matrix.engine }}
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Test ${{ matrix.project }} regressions (simulated scores and push)
        run: npm run test:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - name: Record browser runner state
        if: always()
        shell: bash
        run: |
          mkdir -p output/playwright/server
          {
            date -u
            uptime || true
            free -m || true
            df -h . || true
            ps -eo pid,ppid,rss,pcpu,etime,comm --sort=-rss | head -40 || true
            cat /proc/pressure/memory /sys/fs/cgroup/memory.events 2>&1 || true
            dmesg -T 2>&1 | tail -80 || true
          } > output/playwright/server/runner-state.txt 2>&1
          {
            echo '### Browser harness'
            echo "Run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT; shard $BROWSER_TEST_SHARD"
            echo "PR head $PR_HEAD_SHA; tested commit $SOURCE_COMMIT"
            node -e 'const fs=require("fs"); try { const s=JSON.parse(fs.readFileSync("output/playwright/server/state.json")); if(s.exit) console.log(`Wrangler exit ${s.exit.signal||s.exit.code} at ${s.exit.utc}; diagnostics in browser artifact`); } catch {}'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save ${{ matrix.project }} evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-${{ matrix.project }}-${{ matrix.shardIndex }}of${{ matrix.shardTotal }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .wrangler/logs/
            output/playwright/
          include-hidden-files: true
          retention-days: 14
  updater:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: .wrangler/logs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record source commit
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Prefer the canonical Ubuntu archive for browser dependencies
        run: bash -c "$PREFER_CANONICAL_UBUNTU_ARCHIVE"
      - name: Install updater browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Test explicit app updates across two local builds
        run: npm run test:updater
      - name: Save updater evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: updater-${{ github.sha }}
          path: |
            .wrangler/logs/
            output/playwright/
          include-hidden-files: true
          retention-days: 14
  test:
    if: always()
    needs: [core, browser, updater]
    runs-on: ubuntu-latest
    steps:
      - name: Require core and both browser engines
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          UPDATER_RESULT: ${{ needs.updater.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$UPDATER_RESULT" = success
