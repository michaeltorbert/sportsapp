name: Release to Cloudflare
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to deploy (for example v1.2.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://saturday-signal.scythe-wildflower.workers.dev
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CLOUDFLARE_ACCOUNT_ID: '092f7a0a1516725ba2217cfb3760b38f'
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: .wrangler/logs
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Validate release identity
        run: |
          npm run release:check
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - name: Build and test exact release source
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .release-evidence
          npm test 2>&1 | tee .release-evidence/tests.log
          npm run test:runtime
          npm run deploy:check
          npm run deploy:alerts -- --dry-run
      - name: Deploy existing alert service, then website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set CLOUDFLARE_API_TOKEN in the production environment."; exit 1; }
          npm run deploy:alerts
          npm run deploy:app
      - name: Verify deployed release and both alert origins
        shell: bash
        run: |
          set -o pipefail
          npm run release:verify 2>&1 | tee .release-evidence/deployment.log
      - name: Save release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-evidence/*.log
          include-hidden-files: true
          retention-days: 30
